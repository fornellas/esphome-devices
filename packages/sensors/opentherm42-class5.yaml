opentherm42:
  # §5.3.5 Class 5, ID 6: Remote-parameter transfer-enable/read-write flags -- required since the 4
  # text_sensors below are configured.
  pre_defined_remote_boiler_parameters_flags_update_every: 6
  # §5.3.5 Class 5, ID 48: DHWsetp bounds -- required since both sensors below are configured.
  pre_defined_remote_boiler_parameters_dhwsetp_update_every: 6
  # §5.3.5 Class 5, ID 49: max CHsetp bounds -- required since both sensors below are configured.
  pre_defined_remote_boiler_parameters_max_chsetp_update_every: 6

number:
  - platform: opentherm42
    # §5.3.5 Class 5, ID 56: DHW Setpoint -- the domestic hot water temperature setpoint (degrees C,
    # 0..127). Setting this writes the value to the boiler; it also shows back whatever the boiler
    # confirms it's actually using.
    pre_defined_remote_boiler_parameters_dhw_setpoint:
      name: "C5: DHW Setpoint"
      initial_value: 40.0
      update_every: 6
    # §5.3.5 Class 5, ID 57: max CH water Setpoint -- the maximum allowed CH water setpoint (degrees C,
    # 0..127), same read/write behavior as DHW Setpoint above.
    pre_defined_remote_boiler_parameters_max_ch_water_setpoint:
      name: "C5: max CH water Setpoint"
      initial_value: 50.0
      update_every: 6
    # §5.3.5 Class 5, ID 87 HB: Nominal ventilation value -- the mid-position value for a 3-speed
    # ventilation system (0-100%). 0% is the minimum set ventilation, 100% is the maximum.
    # pre_defined_remote_boiler_parameters_nominal_ventilation_value:
    #   name: "C5: Nominal ventilation value"
    #   initial_value: 50
    #   update_every: 6

text_sensor:
  - platform: opentherm42
    # §5.3.5 Class 5, ID 6 HB bit 0: DHW Setpoint [ transfer disabled, transfer enabled ]
    pre_defined_remote_boiler_parameters_transfer_enable_flags_dhw_setpoint:
      name: "C5: Remote-parameter transfer-enable flags: DHW Setpoint"
    # §5.3.5 Class 5, ID 6 HB bit 1: max CHsetpoint [ transfer disabled, transfer enabled ]
    pre_defined_remote_boiler_parameters_transfer_enable_flags_max_chsetpoint:
      name: "C5: Remote-parameter transfer-enable flags: max CHsetpoint"
    # §5.3.5 Class 5, ID 6 LB bit 0: DHW Setpoint [ read-only, read/write ]
    pre_defined_remote_boiler_parameters_read_write_flags_dhw_setpoint:
      name: "C5: Remote-parameter read-write flags: DHW Setpoint"
    # §5.3.5 Class 5, ID 6 LB bit 1: max CHsetpoint [ read-only, read/write ]
    pre_defined_remote_boiler_parameters_read_write_flags_max_chsetpoint:
      name: "C5: Remote-parameter read-write flags: max CHsetpoint"
    # §5.3.5 Class 5, ID 86 HB bit 0: Nominal ventilation value [ transfer disabled, transfer enabled ]
    # pre_defined_remote_boiler_parameters_transfer_enable_flags_ventilation_heat_recovery_nominal_ventilation_value:
    #   name: "C5: Transfer-enable flags ventilation-heat-recovery: Nominal ventilation value"
    # §5.3.5 Class 5, ID 86 LB bit 0: Nominal ventilation value [ read-only, read/write ]
    # pre_defined_remote_boiler_parameters_read_write_flags_ventilation_heat_recovery_nominal_ventilation_value:
    #   name: "C5: Read-write flags ventilation-heat-recovery: Nominal ventilation value"

sensor:
  - platform: opentherm42
    # §5.3.5 Class 5, ID 48 HB: the upper bound your boiler allows for adjusting the DHW Setpoint number
    # above (degrees C).
    pre_defined_remote_boiler_parameters_dhwsetp_upper_bound:
      name: "C5: DHWsetp upp-bound"
    # §5.3.5 Class 5, ID 48 LB: the lower bound your boiler allows for adjusting the DHW Setpoint number
    # above (degrees C).
    pre_defined_remote_boiler_parameters_dhwsetp_lower_bound:
      name: "C5: DHWsetp low-bound"
    # §5.3.5 Class 5, ID 49 HB: the upper bound your boiler allows for adjusting the max CH water
    # Setpoint number above (degrees C).
    pre_defined_remote_boiler_parameters_max_chsetp_upper_bound:
      name: "C5: max CHsetp upp-bound"
    # §5.3.5 Class 5, ID 49 LB: the lower bound your boiler allows for adjusting the max CH water
    # Setpoint number above (degrees C).
    pre_defined_remote_boiler_parameters_max_chsetp_lower_bound:
      name: "C5: max CHsetp low-bnd"
