
switch:
  - platform: opentherm42
    # §5.3.8.3 Class 8, ID 99 HB bit 4: Manual DHW push2 -- read/write, packed alongside the three
    # Operating Mode selects below.
    control_of_special_applications_manual_dhw_push2:
      name: "C8: Manual DHW push2"

number:
  - platform: opentherm42
    # §5.3.8.1 Class 8, ID 7: Cooling control signal -- signal for the cooling plant (0..100%).
    # control_of_special_applications_cooling_control_signal:
    #   name: "C8: Cooling control signal"
    #   initial_value: 0
    # §5.3.8.2 Class 8, ID 14: Maximum relative modulation level setting, for sequencer and
    # off-low&pump control applications (0..100%).
    control_of_special_applications_maximum_relative_modulation_level_setting:
      name: "C8: Maximum relative modulation level setting"
      initial_value: 100

text_sensor:
  - platform: opentherm42
    # §5.3.8.3 Class 8, ID 100 LB bit 0: Manual change priority [ disable overruling remote Setpoint
    # by manual Setpoint change, enable overruling remote Setpoint by manual Setpoint change ]
    # control_of_special_applications_remote_override_room_setpoint_function_manual_change_priority:
    #   name: "C8: Remote Override Room Setpoint function: Manual change priority"
    # §5.3.8.3 Class 8, ID 100 LB bit 1: Program change priority [ disable overruling remote Setpoint
    # by program Setpoint change, enable overruling remote Setpoint by program Setpoint change ]
    # control_of_special_applications_remote_override_room_setpoint_function_program_change_priority:
    #   name: "C8: Remote Override Room Setpoint function: Program change priority"

select:
  - platform: opentherm42
    # §5.3.8.3 Class 8, ID 99 HB bits 0-3: Remote Override Operating Mode DHW -- read/write.
    control_of_special_applications_remote_override_operating_mode_dhw:
      name: "C8: Remote Override Operating Mode DHW"
    # §5.3.8.3 Class 8, ID 99 LB bits 0-3: Remote Override Operating Mode Heating HC1 -- read/write.
    control_of_special_applications_remote_override_operating_mode_heating_hc1:
      name: "C8: Remote Override Operating Mode Heating HC1"
    # §5.3.8.3 Class 8, ID 99 LB bits 4-7: Remote Override Operating Mode Heating HC2, same
    # encoding as HC1.
    # control_of_special_applications_remote_override_operating_mode_heating_hc2:
    #   name: "C8: Remote Override Operating Mode Heating HC2"

sensor:
  - platform: opentherm42
    # §5.3.8.2 Class 8, ID 15 HB: Maximum boiler capacity (0..255 kW), expressed as a percentage of
    # the maximum capacity.
    control_of_special_applications_maximum_boiler_capacity:
      name: "C8: Maximum boiler capacity"
    # §5.3.8.2 Class 8, ID 15 LB: Minimum modulation level (0..100%).
    control_of_special_applications_minimum_modulation_level:
      name: "C8: Minimum modulation level"
    # §5.3.8.3 Class 8, ID 9: Remote Override Room Setpoint (degrees C, 0..30).
    # 0 = No override, 1..30 = Remote override room Setpoint.
    control_of_special_applications_remote_override_room_setpoint:
      name: "C8: Remote Override Room Setpoint"
    # §5.3.8.3 Class 8, ID 39: Remote Override Room Setpoint 2 (degrees C, 0..30), same encoding.
    # control_of_special_applications_remote_override_room_setpoint_2:
    #   name: "C8: Remote Override Room Setpoint 2"
