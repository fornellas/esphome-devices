opentherm42:
  # §5.3.7 Class 7, IDs 13/91/108: governs how fast the shared fault-history-buffer round-robin
  # rotation advances -- required since fault_history_data_fault_buffer below is configured.
  fault_history_data_fault_buffer_update_every: 7

sensor:
  - platform: opentherm42
    # §5.3.7 Class 7, ID 12 HB: how many entries the boiler's fault history can hold.
    fault_history_data_size_of_fault_buffer:
      name: "C7: Size of Fault Buffer"
      update_every: 7
    # §5.3.7 Class 7, ID 90 HB: how many fault history entries the ventilation/heat-recovery system can
    # hold.
    # fault_history_data_size_of_fault_buffer_ventilation_heat_recovery:
    #   name: "C7: Size of Fault Buffer ventilation-heat-recovery"
    #   update_every: 7
    # §5.3.7 Class 7, ID 107 HB: how many fault history entries the Solar Storage system can hold.
    # fault_history_data_size_of_fault_buffer_solar_storage:
    #   name: "C7: Size of Fault Buffer Solar Storage"
    #   update_every: 7
    # §5.3.7 Class 7, IDs 13/91/108: fault history entries are manufacturer-specific, so unlike every
    # other option here there's no off-the-shelf name for them -- check your boiler's own documentation
    # for what entry N means, and name/index it accordingly.
    fault_history_data_fault_buffer:
      - index: 0
        name: "C7: Fault Buffer 0"
    # fault_history_data_fault_buffer_ventilation_heat_recovery:
    #   - index: 0
    #     name: "C7: Fault Buffer 0 ventilation-heat-recovery"
    # fault_history_data_fault_buffer_solar_storage:
    #   - index: 0
    #     name: "C7: Fault Buffer 0 Solar Storage"
