external_components:
  - source:
      type: git
      url: https://github.com/fornellas/esphome
      ref: opentherm
    refresh: 0s
    components: [ opentherm42 ]

packages:
  # Class 1: Control and Status Information
  # This class contains basic control information from the master and status information exchange
  # (including fault status) and incorporates all the mandatory OpenTherm data.
  - !include opentherm42-class1.yaml
  # Class 2: Configuration Information
  # Information relating to the configuration of the master and slave and Member identification.
  - !include opentherm42-class2.yaml
  # Class 3: Remote Commands
  # This class allows for commands to be passed from the master to the slave.
  - !include opentherm42-class3.yaml
  # Class 4: Sensor and Informational Data
  # This class covers typically sensor temperatures, pressures etc.
  - !include opentherm42-class4.yaml
  # Class 5: Remote Boiler Parameters
  # These are parameters of the slave device which may be read or set by the master and are
  # specific to boiler applications.
  - !include opentherm42-class5.yaml
  # Class 6: Transparent Slave Parameters
  # This class allows slave parameters to be read or set by the master without knowledge of their
  # physical or application-specific meaning.
  # - !include opentherm42-class6.yaml
  # Class 7: Fault History Information
  # This data allows historical fault information to be passed from the slave to the master.
  # Control of Special Applications
  - !include opentherm42-class7.yaml
  # Class 8: Control of Special Applications
  # This class defines data id’s to be exchanged between the master and a application specific slave.
  - !include opentherm42-class8.yaml

opentherm42:
  in_pin: ${opentherm42_in_pin}
  out_pin: ${opentherm42_out_pin}
  # §4.4.1: some boilers answer "data not available" for a reading a few times in a row before giving a
  # real value, for no obvious reason. This tolerates that many consecutive invalid responses to the same
  # reading before actually marking its entity Unknown, instead of flipping back and forth. 0 (the
  # default) marks it Unknown on the very first invalid response.
  max_data_invalid: 5
  # Selects how this device talks to the boiler on the wire:
  #   esp32_rmt (the default on ESP32 boards that have it): uses a dedicated hardware peripheral, which
  #     avoids interference from other components that briefly disable interrupts (e.g. Dallas
  #     temperature sensors). It's newer than esp_isr below and less proven in real installations so far.
  #   esp_isr: a software, interrupt-driven implementation. The only option on ESP8266 and on ESP32
  #     boards without the RMT peripheral, and the longer-proven of the two elsewhere. Pick this
  #     explicitly if your other components have already claimed every RMT channel on your board, or if
  #     you have Dallas temperature sensors (or similar) and run into communication errors with esp32_rmt.
  # Leave unset to have the best option for your board chosen automatically.
  datalink: esp32_rmt
  # datalink: esp_isr
  # §5.2: how often this hub re-checks the boiler's mandatory status exchange. This always runs,
  # regardless of which entities below are configured.
  control_and_status_information_boiler_status_update_every: 1
  # §5.3.2 Class 2, IDs 2/124/126: how often this controller re-announces its own identity to the boiler.
  # This always runs too, since there's no entity to turn it on or off with.
  configuration_information_master_configuration_update_every: 6
  configuration_information_master_opentherm_version_update_every: 6
  configuration_information_master_product_version_update_every: 6

sensor:
    - platform: opentherm42
      # How long it took to refresh every configured reading at least once (one full round of polling).
      # Not a real OpenTherm reading -- useful for noticing if your boiler is responding slowly, or if
      # you've configured enough readings that a full round is taking a long time. Always active, so there's
      # no update_every option for it.
      sweep_duration:
        name: "Sweep duration"
      # How long the most recent single poll took. This device polls one reading at a time rather than all
      # at once, so this will normally be much shorter than Sweep duration above -- it's mainly useful for
      # spotting a single slow or stuck exchange with the boiler.
      pass_duration:
        name: "Pass duration"

binary_sensor:
    - platform: opentherm42
      # Turns on if any reading failed or was rejected during the most recent full round of polling the
      # boiler. Not a real OpenTherm reading -- a convenience flag for noticing communication problems at a
      # glance. Always active, so there's no update_every option for it.
      sweep_had_errors:
        name: "Sweep had errors"
