# time:
#   - platform: sntp
#     id: my_time

opentherm42:
  # §5.3.4 Class 4, IDs 20/21/22: keeps the boiler's clock (day of week/time, date, year) synced to this
  # time source.
  # time_id: my_time
  # §5.3.4 Class 4, ID 35: HB Boiler fan speed Setpoint, LB Boiler fan speed -- required since both
  # sensors below are configured.
  sensor_and_informational_data_boiler_fan_speed_update_every: 3

number:
  - platform: opentherm42
    # §5.3.4 Class 4, ID 16: Room Setpoint -- the current room temperature setpoint (degrees C, -40..127).
    sensor_and_informational_data_room_setpoint:
      name: "C4: Room Setpoint"
      initial_value: 20.0
      update_every: 2
    # §5.3.4 Class 4, ID 23: Room Setpoint CH2 -- the current room setpoint for a second CH circuit
    # (degrees C, -40..127).
    # sensor_and_informational_data_room_setpoint_ch2:
    #   name: "C4: Room Setpoint CH2"
    #   initial_value: 20.0
    #   update_every: 2
    # §5.3.4 Class 4, ID 37: TrCH2 -- room temperature for a second CH circuit (degrees C, -40..127).
    # Same idea as Room temperature below -- no initial_value.
    # sensor_and_informational_data_trch2:
    #   name: "C4: TrCH2"
    #   initial_value: 20.0
    # §5.3.4 Class 4, ID 24: Room temperature -- your own measured room temperature, sent to the boiler
    # (degrees C, -40..127) so it can do outside-temperature-compensation-style control. No initial_value,
    # since there's no sensible default for a live measurement like this -- the entity has no value until
    # something (e.g. an automation reading a real sensor) first sets one.
    sensor_and_informational_data_room_temperature:
      name: "C4 Data: Room temperature"
    # §5.3.4 Class 4, ID 27: Outside temperature (degrees C, -40..127), supplied by you (e.g. from a
    # weather or outdoor sensor) rather than read from the boiler. No initial_value, same reasoning as
    # Room temperature above.
    sensor_and_informational_data_outside_temperature:
      name: "C4: Outside temperature"
      update_every: 5
    # §5.3.4 Class 4, ID 38: Relative Humidity (0..100%), supplied by you.
    # sensor_and_informational_data_relative_humidity:
    #   name: "C4: Relative Humidity"
    #   update_every: 5
    # §5.3.4 Class 4, ID 78 LB: Relative humidity of the exhaust air (0..100%), supplied by you.
    # sensor_and_informational_data_relative_humidity_exhaust_air:
    #   name: "C4: Relative humidity exhaust air"
    #   update_every: 5
    # §5.3.4 Class 4, ID 79: CO2 level of the exhaust air (0..2000 ppm), supplied by you.
    # sensor_and_informational_data_co2_level:
    #   name: "C4: CO2 level"
    #   update_every: 5

binary_sensor:
  - platform: opentherm42
    # §5.3.4 Class 4, IDs 20/21/22: turns on once the day-of-week/time, date and year have all been
    # successfully sent to the boiler (see time_id above). Not a real OpenTherm reading -- a convenience
    # flag this component provides. Requires time_id.
    # sensor_and_informational_data_time_synchronized:
    #   name: "C4: Time synchronized"

button:
  - platform: opentherm42
    # §5.3.4 Class 4, ID 96: resets this counter to zero. Not every boiler supports this (optional for
    # the boiler to honor).
    # sensor_and_informational_data_cooling_operation_hours_reset:
    #   name: "C4: Cooling Operation hours reset"
    # §5.3.4 Class 4, ID 97: resets this counter to zero. Optional for the boiler to honor.
    # sensor_and_informational_data_power_cycles_reset:
    #   name: "C4: Power Cycles reset"
    # §5.3.4 Class 4, ID 109: resets this counter to zero. Optional for the boiler to honor.
    # sensor_and_informational_data_electricity_producer_starts_reset:
    #   name: "C4: Electricity producer starts reset"
    # §5.3.4 Class 4, ID 110: resets this counter to zero. Optional for the boiler to honor.
    # sensor_and_informational_data_electricity_producer_hours_reset:
      # name: "C4: Electricity producer hours reset"
    # §5.3.4 Class 4, ID 112: resets this counter to zero. Optional for the boiler to honor.
    # sensor_and_informational_data_cumulative_electricity_production_reset:
    #   name: "C4: Cumulative Electricity production reset"
    # §5.3.4 Class 4, ID 113: resets this counter to zero. Optional for the boiler to honor.
    sensor_and_informational_data_number_of_unsuccessful_burner_starts_reset:
      name: "C4: Number of un-successful burner starts reset"
    # §5.3.4 Class 4, ID 114: resets this counter to zero. Optional for the boiler to honor.
    sensor_and_informational_data_number_of_times_flame_signal_too_low_reset:
      name: "C4: Number of times flame signal too low reset"
    # §5.3.4 Class 4, ID 116: resets this counter to zero. Optional for the boiler to honor.
    sensor_and_informational_data_successful_burner_starts_reset:
      name: "C4: Successful Burner starts reset"
    # §5.3.4 Class 4, ID 117: resets this counter to zero. Optional for the boiler to honor.
    sensor_and_informational_data_ch_pump_starts_reset:
      name: "C4: CH pump starts reset"
    # §5.3.4 Class 4, ID 118: resets this counter to zero. Optional for the boiler to honor.
    sensor_and_informational_data_dhw_pump_valve_starts_reset:
      name: "C4: DHW pump-valve starts reset"
    # §5.3.4 Class 4, ID 119: resets this counter to zero. Optional for the boiler to honor.
    sensor_and_informational_data_dhw_burner_starts_reset:
      name: "C4: DHW burner starts reset"
    # §5.3.4 Class 4, ID 120: resets this counter to zero. Optional for the boiler to honor.
    sensor_and_informational_data_burner_operation_hours_reset:
      name: "C4: Burner operation hours reset"
    # §5.3.4 Class 4, ID 121: resets this counter to zero. Optional for the boiler to honor.
    sensor_and_informational_data_ch_pump_operation_hours_reset:
      name: "C4: CH pump operation hours reset"
    # §5.3.4 Class 4, ID 122: resets this counter to zero. Optional for the boiler to honor.
    sensor_and_informational_data_dhw_pump_valve_operation_hours_reset:
      name: "C4: DHW pump-valve operation hours reset"
    # §5.3.4 Class 4, ID 123: resets this counter to zero. Optional for the boiler to honor.
    sensor_and_informational_data_dhw_burner_operation_hours_reset:
      name: "C4: DHW burner operation hours reset"
    # §5.3.4 Class 4, IDs 20/21/22: forces an immediate time-sync attempt instead of waiting for the next
    # scheduled one (see time_id above). Requires time_id.
    # sensor_and_informational_data_sync_time:
    #   name: "C4: Sync time"

text_sensor:
  - platform: opentherm42
    # §5.3.4 Class 4, IDs 20/21/22: the boiler's own reported day of week/time, date and year --
    # independent of time_id above (that's the value this controller sends).
    # sensor_and_informational_data_date_time:
    #   name: "C4: Date and time"
    #   update_every: 7

sensor:
  - platform: opentherm42
    # §5.3.4 Class 4, ID 17: Relative Modulation Level (0..100%) -- how hard the burner is currently
    # firing, relative to its own minimum and maximum. 0% = minimum, 100% = maximum.
    sensor_and_informational_data_relative_modulation_level:
      name: "C4: Relative Modulation Level"
      update_every: 3
    # §5.3.4 Class 4, ID 18: CH (central heating) water pressure (bar, 0..5).
    sensor_and_informational_data_ch_water_pressure:
      name: "C4: CH water pressure"
      update_every: 3
    # §5.3.4 Class 4, ID 19: DHW (domestic hot water) flow rate (l/min, 0..16).
    sensor_and_informational_data_dhw_flow_rate:
      name: "C4: DHW flow rate"
      update_every: 3
    # §5.3.4 Class 4, ID 25: Boiler water temperature -- the temperature of the water leaving the boiler,
    # heading out to the CH circuit (degrees C).
    sensor_and_informational_data_boiler_water_temperature:
      name: "C4: Boiler water temp."
      update_every: 3
    # §5.3.4 Class 4, ID 26: DHW temperature -- the actual domestic hot water temperature, i.e. the water
    # that comes out of your taps (degrees C). A separate circuit from the CH flow/return readings.
    sensor_and_informational_data_dhw_temperature:
      name: "C4: DHW temperature"
      update_every: 3
    # §5.3.4 Class 4, ID 28: Return water temperature -- the temperature of the water coming back into
    # the boiler after circulating through the CH system (degrees C). Always lower than Boiler water
    # temperature above; the gap between the two is a rough indicator of how much heat the radiators
    # extracted.
    sensor_and_informational_data_return_water_temperature:
      name: "C4: Return water temperature"
      update_every: 3
    # §5.3.4 Class 4, ID 29: Solar storage temperature (degrees C).
    # sensor_and_informational_data_solar_storage_temperature:
    #   name: "C4: Solar storage temperature"
    #   update_every: 3
    # §5.3.4 Class 4, ID 30: Solar collector temperature (degrees C, -40..250).
    # sensor_and_informational_data_solar_collector_temperature:
    #   name: "C4: Solar collector temperature"
    #   update_every: 3
    # §5.3.4 Class 4, ID 31: Flow temperature CH2 -- the flow water temperature of a second CH circuit
    # (degrees C).
    # sensor_and_informational_data_flow_temperature_ch2:
    #   name: "C4: Flow temperature CH2"
    #   update_every: 3
    # §5.3.4 Class 4, ID 32: DHW2 temperature -- a second domestic hot water temperature reading, on
    # boilers with two DHW circuits (degrees C).
    # sensor_and_informational_data_dhw2_temperature:
    #   name: "C4: DHW2 temperature"
    #   update_every: 3
    # §5.3.4 Class 4, ID 33: Exhaust (flue gas) temperature (degrees C, -40..500).
    sensor_and_informational_data_exhaust_temperature:
      name: "C4: Exhaust temperature"
      update_every: 3
    # §5.3.4 Class 4, ID 34: Boiler heat exchanger temperature (degrees C).
    # sensor_and_informational_data_boiler_heat_exchanger_temperature:
    #   name: "C4: Boiler heat exchanger temperature"
    #   update_every: 3
    # §5.3.4 Class 4, ID 35 HB: the boiler's own target fan speed, in Hz (RPM/60), 0..255.
    sensor_and_informational_data_boiler_fan_speed_setpoint:
      name: "C4: Boiler fan speed Setpoint"
    # §5.3.4 Class 4, ID 35 LB: the boiler's actual fan speed, in Hz (RPM/60), 0..255.
    sensor_and_informational_data_boiler_fan_speed:
      name: "C4: Boiler fan speed"
    # §5.3.4 Class 4, ID 36: Flame current -- the electrical current through the burner's flame sensor
    # (µA, 0..127). Used by some boilers as a flame-quality indicator.
    sensor_and_informational_data_flame_current:
      name: "C4: Flame current"
      update_every: 3
    # §5.3.4 Class 4, ID 77 LB: Relative ventilation (0-100%). 0% is the minimum set value, 100% is the
    # maximum.
    # sensor_and_informational_data_relative_ventilation:
    #   name: "C4: Relative ventilation"
    #   update_every: 3
    # §5.3.4 Class 4, ID 80: Supply inlet temperature (degrees C).
    # sensor_and_informational_data_supply_inlet_temperature:
    #   name: "C4: Supply inlet temperature"
    #   update_every: 3
    # §5.3.4 Class 4, ID 81: Supply outlet temperature (degrees C).
    # sensor_and_informational_data_supply_outlet_temperature:
    #   name: "C4: Supply outlet temperature"
    #   update_every: 3
    # §5.3.4 Class 4, ID 82: Exhaust inlet temperature (degrees C).
    # sensor_and_informational_data_exhaust_inlet_temperature:
    #   name: "C4: Exhaust inlet temperature"
    #   update_every: 3
    # §5.3.4 Class 4, ID 83: Exhaust outlet temperature (degrees C).
    # sensor_and_informational_data_exhaust_outlet_temperature:
    #   name: "C4: Exhaust outlet temperature"
    #   update_every: 3
    # §5.3.4 Class 4, ID 84: Actual exhaust fan speed (rpm, 0..6000).
    # sensor_and_informational_data_actual_exhaust_fan_speed:
    #   name: "C4: Actual exhaust fan speed"
    #   update_every: 3
    # §5.3.4 Class 4, ID 85: Actual inlet fan speed (rpm, 0..6000).
    # sensor_and_informational_data_actual_inlet_fan_speed:
    #   name: "C4: Actual inlet fan speed"
    #   update_every: 3
    # §5.3.4 Class 4, ID 96: how many hours the boiler has spent in Cooling Mode.
    # sensor_and_informational_data_cooling_operation_hours:
    #   name: "C4: Cooling Operation hours"
    #   update_every: 8
    # §5.3.4 Class 4, ID 97: how many times the boiler has power-cycled (woken up after a reset).
    # sensor_and_informational_data_power_cycles:
    #   name: "C4: Power Cycles"
    #   update_every: 8
    # §5.3.4 Class 4, ID 109: how many times the boiler's electricity producer has started.
    # sensor_and_informational_data_electricity_producer_starts:
    #   name: "C4: Electricity producer starts"
    #   update_every: 8
    # §5.3.4 Class 4, ID 110: how many hours the boiler's electricity producer has been running.
    # sensor_and_informational_data_electricity_producer_hours:
    #   name: "C4: Electricity producer hours"
    #   update_every: 8
    # §5.3.4 Class 4, ID 111: current electricity production (W), on boilers with a CHP/electricity
    # generation feature.
    # sensor_and_informational_data_electricity_production:
    #   name: "C4: Electricity production"
    #   update_every: 3
    # §5.3.4 Class 4, ID 112: cumulative electricity production (kWh).
    # sensor_and_informational_data_cumulative_electricity_production:
    #   name: "C4: Cumulative Electricity production"
    #   update_every: 8
    # §5.3.4 Class 4, ID 113: how many burner starts have failed.
    sensor_and_informational_data_number_of_unsuccessful_burner_starts:
      name: "C4: Number of un-successful burner starts"
      update_every: 8
    # §5.3.4 Class 4, ID 114: how many times the flame signal has been too low.
    sensor_and_informational_data_number_of_times_flame_signal_too_low:
      name: "C4: Number of times flame signal was too low"
      update_every: 8
    # §5.3.4 Class 4, ID 116: how many burner starts have succeeded.
    sensor_and_informational_data_successful_burner_starts:
      name: "C4: Successful Burner starts"
      update_every: 8
    # §5.3.4 Class 4, ID 117: how many times the CH pump has started.
    sensor_and_informational_data_ch_pump_starts:
      name: "C4: CH pump starts"
      update_every: 8
    # §5.3.4 Class 4, ID 118: how many times the DHW pump/valve has started.
    sensor_and_informational_data_dhw_pump_valve_starts:
      name: "C4: DHW pump-valve starts"
      update_every: 8
    # §5.3.4 Class 4, ID 119: how many times the burner has started in DHW mode.
    sensor_and_informational_data_dhw_burner_starts:
      name: "C4: DHW burner starts"
      update_every: 8
    # §5.3.4 Class 4, ID 120: how many hours the burner has been firing in total.
    sensor_and_informational_data_burner_operation_hours:
      name: "C4: Burner operation hours"
      update_every: 8
    # §5.3.4 Class 4, ID 121: how many hours the CH pump has been running.
    sensor_and_informational_data_ch_pump_operation_hours:
      name: "C4: CH pump operation hours"
      update_every: 8
    # §5.3.4 Class 4, ID 122: how many hours the DHW pump has been running or the DHW valve has been open.
    sensor_and_informational_data_dhw_pump_valve_operation_hours:
      name: "C4: DHW pump-valve operation hours"
      update_every: 8
    # §5.3.4 Class 4, ID 123: how many hours the burner has been firing in DHW mode.
    sensor_and_informational_data_dhw_burner_operation_hours:
      name: "C4: DHW burner operation hours"
      update_every: 8
