packages:
  - !include ../common.yaml
  - !include ../common-esp32.yaml

esphome:
  # switch restore_mode re-triggers turn_on/turn_off_action on its own, but
  # number/select restore_value only republishes the stored state - it does
  # not re-run set_action. Replay each one through make_call()/perform() once
  # everything is up (priority is below every component's default) so the
  # sensor actually matches what Home Assistant shows after a reboot.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(camera_contrast).make_call().set_value(id(camera_contrast).state).perform();
          id(camera_brightness).make_call().set_value(id(camera_brightness).state).perform();
          id(camera_saturation).make_call().set_value(id(camera_saturation).state).perform();
          id(camera_ae_level).make_call().set_value(id(camera_ae_level).state).perform();
          id(camera_aec_value).make_call().set_value(id(camera_aec_value).state).perform();
          id(camera_agc_value).make_call().set_value(id(camera_agc_value).state).perform();
          id(camera_special_effect).make_call().set_option(id(camera_special_effect).current_option().str()).perform();
          id(camera_wb_mode).make_call().set_option(id(camera_wb_mode).current_option().str()).perform();
          id(camera_agc_gain_ceiling).make_call().set_option(id(camera_agc_gain_ceiling).current_option().str()).perform();

esp32:
  variant: esp32
  board: esp32cam

psram:

i2c:
  - id: camera_i2c
    sda: GPIO26
    scl: GPIO27

esp32_camera:
  id: esp32_camera_id
  # Configuration variables
  name: Camera
  i2c_id: camera_i2c
  # Connection Options
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  power_down_pin: GPIO32
  # resolution is only ever read once, by esp_camera_init() at boot. esp32_camera exposes no re-init
  # call, so unlike everything below (which is pushed live via update_camera_parameters()), it
  # can't be changed without recompiling.
  # resolution: 160x120 # (QQVGA, 4:3)
  # resolution: 176x144 # (QCIF, 11:9)
  # resolution: 240x176 # (HQVGA, 15:11)
  # resolution: 320x240 # (QVGA, 4:3)
  # resolution: 400x296 # (CIF, 50:37)
  # resolution: 640x480 # (VGA, 4:3, default)
  # resolution: 800x600 # (SVGA, 4:3)
  # resolution: 1024x768 # (XGA, 4:3)
  # resolution: 1280x1024 # (SXGA, 5:4)
  resolution: 1600x1200 # (UXGA, 4:3)
  # resolution: 1920x1080 # (FHD, 16:9)
  # resolution: 720x1280 # (Portrait HD, 9:16)
  # resolution: 864x1536 # (Portrait 3MP, 9:16)
  # resolution: 2048x1536 # (QXGA, 4:3)
  # resolution: 2560x1440 # (QHD, 16:9)
  # resolution: 2560x1600 # (WQXGA, 8:5)
  # resolution: 1080x1920 # (Portrait FHD, 9:16)
  # resolution: 2560x1920 # (QSXGA, 4:3)
  # jpeg_quality is only ever read once, by esp_camera_init() at boot. esp32_camera exposes no re-init
  # call, so unlike everything below (which is pushed live via update_camera_parameters()), it
  # can't be changed without recompiling.
  jpeg_quality: 6

switch:
  - platform: gpio
    name: "Flash"
    pin: 4

  - platform: template
    name: "Vertical Flip"
    id: camera_vertical_flip
    icon: mdi:flip-vertical
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(esp32_camera_id).set_vertical_flip(true);
          id(esp32_camera_id).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(esp32_camera_id).set_vertical_flip(false);
          id(esp32_camera_id).update_camera_parameters();

  - platform: template
    name: "Horizontal Mirror"
    id: camera_horizontal_mirror
    icon: mdi:flip-horizontal
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(esp32_camera_id).set_horizontal_mirror(true);
          id(esp32_camera_id).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(esp32_camera_id).set_horizontal_mirror(false);
          id(esp32_camera_id).update_camera_parameters();

  - platform: template
    name: "Auto Exposure Control"
    id: camera_aec_mode
    icon: mdi:brightness-auto
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(esp32_camera_id).set_aec_mode(esphome::esp32_camera::ESP32_GC_MODE_AUTO);
          id(esp32_camera_id).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(esp32_camera_id).set_aec_mode(esphome::esp32_camera::ESP32_GC_MODE_MANU);
          id(esp32_camera_id).update_camera_parameters();

  - platform: template
    name: "AEC2"
    id: camera_aec2
    icon: mdi:tune
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(esp32_camera_id).set_aec2(true);
          id(esp32_camera_id).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(esp32_camera_id).set_aec2(false);
          id(esp32_camera_id).update_camera_parameters();

  - platform: template
    name: "Auto Gain Control"
    id: camera_agc_mode
    icon: mdi:brightness-auto
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(esp32_camera_id).set_agc_mode(esphome::esp32_camera::ESP32_GC_MODE_AUTO);
          id(esp32_camera_id).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(esp32_camera_id).set_agc_mode(esphome::esp32_camera::ESP32_GC_MODE_MANU);
          id(esp32_camera_id).update_camera_parameters();

number:
  - platform: template
    name: "Contrast"
    id: camera_contrast
    icon: mdi:contrast-circle
    entity_category: config
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    optimistic: true
    initial_value: 0
    restore_value: true
    set_action:
      - lambda: |-
          id(esp32_camera_id).set_contrast((int) x);
          id(esp32_camera_id).update_camera_parameters();

  - platform: template
    name: "Brightness"
    id: camera_brightness
    icon: mdi:brightness-6
    entity_category: config
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    optimistic: true
    initial_value: 0
    restore_value: true
    set_action:
      - lambda: |-
          id(esp32_camera_id).set_brightness((int) x);
          id(esp32_camera_id).update_camera_parameters();

  - platform: template
    name: "Saturation"
    id: camera_saturation
    icon: mdi:palette
    entity_category: config
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    optimistic: true
    initial_value: 0
    restore_value: true
    set_action:
      - lambda: |-
          id(esp32_camera_id).set_saturation((int) x);
          id(esp32_camera_id).update_camera_parameters();

  - platform: template
    name: "Exposure Compensation"
    id: camera_ae_level
    icon: mdi:plus-minus-variant
    entity_category: config
    min_value: -2
