    mode: slider
    optimistic: true
    initial_value: 0
    restore_value: true
    set_action:
      - lambda: |-
          id(esp32_camera_id).set_agc_value((uint8_t) x);
          id(esp32_camera_id).update_camera_parameters();

select:
  - platform: template
    name: "Special Effect"
    id: camera_special_effect
    icon: mdi:image-filter-vintage
    entity_category: config
    optimistic: true
    initial_option: "None"
    restore_value: true
    options:
      - "None"
      - "Negative"
      - "Grayscale"
      - "Red Tint"
      - "Green Tint"
      - "Blue Tint"
      - "Sepia"
    set_action:
      - lambda: |-
          if (x == "None") {
            id(esp32_camera_id).set_special_effect(esphome::esp32_camera::ESP32_SPECIAL_EFFECT_NONE);
          } else if (x == "Negative") {
            id(esp32_camera_id).set_special_effect(esphome::esp32_camera::ESP32_SPECIAL_EFFECT_NEGATIVE);
          } else if (x == "Grayscale") {
            id(esp32_camera_id).set_special_effect(esphome::esp32_camera::ESP32_SPECIAL_EFFECT_GRAYSCALE);
          } else if (x == "Red Tint") {
            id(esp32_camera_id).set_special_effect(esphome::esp32_camera::ESP32_SPECIAL_EFFECT_RED_TINT);
          } else if (x == "Green Tint") {
            id(esp32_camera_id).set_special_effect(esphome::esp32_camera::ESP32_SPECIAL_EFFECT_GREEN_TINT);
          } else if (x == "Blue Tint") {
            id(esp32_camera_id).set_special_effect(esphome::esp32_camera::ESP32_SPECIAL_EFFECT_BLUE_TINT);
          } else if (x == "Sepia") {
            id(esp32_camera_id).set_special_effect(esphome::esp32_camera::ESP32_SPECIAL_EFFECT_SEPIA);
          }
          id(esp32_camera_id).update_camera_parameters();

  - platform: template
    name: "White Balance Mode"
    id: camera_wb_mode
    icon: mdi:white-balance-auto
    entity_category: config
    optimistic: true
    initial_option: "Auto"
    restore_value: true
    options:
      - "Auto"
      - "Sunny"
      - "Cloudy"
      - "Office"
      - "Home"
    set_action:
      - lambda: |-
          if (x == "Auto") {
            id(esp32_camera_id).set_wb_mode(esphome::esp32_camera::ESP32_WB_MODE_AUTO);
          } else if (x == "Sunny") {
            id(esp32_camera_id).set_wb_mode(esphome::esp32_camera::ESP32_WB_MODE_SUNNY);
          } else if (x == "Cloudy") {
            id(esp32_camera_id).set_wb_mode(esphome::esp32_camera::ESP32_WB_MODE_CLOUDY);
          } else if (x == "Office") {
            id(esp32_camera_id).set_wb_mode(esphome::esp32_camera::ESP32_WB_MODE_OFFICE);
          } else if (x == "Home") {
            id(esp32_camera_id).set_wb_mode(esphome::esp32_camera::ESP32_WB_MODE_HOME);
          }
          id(esp32_camera_id).update_camera_parameters();

  - platform: template
    name: "Gain Ceiling"
    id: camera_agc_gain_ceiling
    icon: mdi:gauge-full
    entity_category: config
    optimistic: true
    initial_option: "2x"
    restore_value: true
    options:
      - "2x"
      - "4x"
      - "8x"
      - "16x"
      - "32x"
      - "64x"
      - "128x"
    set_action:
      - lambda: |-
          if (x == "2x") {
            id(esp32_camera_id).set_agc_gain_ceiling(esphome::esp32_camera::ESP32_GAINCEILING_2X);
          } else if (x == "4x") {
            id(esp32_camera_id).set_agc_gain_ceiling(esphome::esp32_camera::ESP32_GAINCEILING_4X);
          } else if (x == "8x") {
            id(esp32_camera_id).set_agc_gain_ceiling(esphome::esp32_camera::ESP32_GAINCEILING_8X);
          } else if (x == "16x") {
            id(esp32_camera_id).set_agc_gain_ceiling(esphome::esp32_camera::ESP32_GAINCEILING_16X);
          } else if (x == "32x") {
            id(esp32_camera_id).set_agc_gain_ceiling(esphome::esp32_camera::ESP32_GAINCEILING_32X);
          } else if (x == "64x") {
            id(esp32_camera_id).set_agc_gain_ceiling(esphome::esp32_camera::ESP32_GAINCEILING_64X);
          } else if (x == "128x") {
            id(esp32_camera_id).set_agc_gain_ceiling(esphome::esp32_camera::ESP32_GAINCEILING_128X);
          }
          id(esp32_camera_id).update_camera_parameters();
