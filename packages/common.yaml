packages:
  - !include debug.yaml
  - !include logger.yaml
  - !include wifi.yaml

binary_sensor:
  - platform: status
    name: "Status"

button:
  - platform: factory_reset
    id: button_factory_reset
    name: "Factory Reset"
    disabled_by_default: true

  - platform: restart
    name: "Restart"
    disabled_by_default: true

  - platform: safe_mode
    name: "Safe Mode"
    disabled_by_default: true

  - platform: shutdown
    name: "Shutdown"
    disabled_by_default: true

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 1min

text_sensor:
  - platform: uptime
    name: Uptime
    disabled_by_default: true
    update_interval: 1min

  - platform: version
    name: "ESPHome Version"
    disabled_by_default: true

factory_reset:
  resets_required: 5
  max_delay: 10s

safe_mode:

api:
  reboot_timeout: 0s
  encryption:
    key: ${api_encryption_key}

ota:
  - platform: esphome
    password: ${ota_password}
    id: ota_esphome

captive_portal:
